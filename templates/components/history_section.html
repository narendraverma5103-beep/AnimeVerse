<!-- History Section with Clear History & Dynamic Empty State -->
<section class="content-section" id="history">
    <div class="section-header">
        <h2 class="section-title"><i class="fa-solid fa-clock-rotate-left" style="color:var(--accent-blue)"></i> Watch History</h2>
        <!-- Clear History Button -->
        <button id="clearHistoryBtn" class="clear-history-btn" onclick="clearWatchHistory()">
            <i class="fa-solid fa-trash-can"></i> Clear History
        </button>
    </div>

    <!-- Watch History Content Wrapper (Dual Rows) -->
    <div id="historyContentWrapper" class="crunchyroll-rows-wrapper">
        
        <!-- ROW 1: Watch History -->
        <div class="movie-row-scroll">
            <div class="row-cards-track" id="historyRow1">
                
                <!-- History Card 1 -->
                <div class="anime-card history-card">
                    <div class="poster-wrapper skeleton-loader">
                        <!-- Top-Right Three Dots Menu Button -->
                        <div class="history-options-container">
                            <button class="history-dots-btn" onclick="toggleHistoryMenu(event, this)">
                                <i class="fa-solid fa-ellipsis-vertical"></i>
                            </button>
                            <div class="history-dropdown-menu">
                                <button onclick="removeSingleHistory(this)"><i class="fa-solid fa-trash"></i> Remove</button>
                                <button onclick="shareHistoryItem(this)"><i class="fa-solid fa-share-nodes"></i> Share</button>
                            </div>
                        </div>

                        <span class="card-badge">EP 12</span>
                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500" alt="History 1" loading="lazy">
                        
                        <!-- Center Play Overlay Button -->
                        <div class="history-play-overlay">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="anime-name">Solo Leveling</div>
                        <div class="meta-info">
                            <span>Watched 2h ago</span>
                            <span class="time-left">14m left</span>
                        </div>
                    </div>
                </div>

                <!-- History Card 2 -->
                <div class="anime-card history-card">
                    <div class="poster-wrapper skeleton-loader">
                        <div class="history-options-container">
                            <button class="history-dots-btn" onclick="toggleHistoryMenu(event, this)">
                                <i class="fa-solid fa-ellipsis-vertical"></i>
                            </button>
                            <div class="history-dropdown-menu">
                                <button onclick="removeSingleHistory(this)"><i class="fa-solid fa-trash"></i> Remove</button>
                                <button onclick="shareHistoryItem(this)"><i class="fa-solid fa-share-nodes"></i> Share</button>
                            </div>
                        </div>

                        <span class="card-badge">EP 08</span>
                        <img src="https://images.unsplash.com/photo-1563089145-599997674d42?w=500" alt="History 2" loading="lazy">
                        
                        <div class="history-play-overlay">
                            <i class="fa-solid fa-play"></i>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="anime-name">Jujutsu Kaisen</div>
                        <div class="meta-info">
                            <span>Yesterday</span>
                            <span class="time-left">08m left</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Empty State Container -->
    <div id="emptyHistoryState" class="empty-history-state" style="display: none;">
        <div class="empty-video-container">
            <canvas id="historyEmptyCanvas"></canvas>
            <video id="historySourceVideo" crossorigin="anonymous" autoplay loop muted playsinline preload="auto">
                <source src="https://res.cloudinary.com/irecrpdg/video/upload/v1793771600/gemini_generated_video_e4513a66.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <h3 class="empty-history-title">No Watch History Found</h3>
        <p class="empty-history-desc">You haven't watched any anime yet. Start exploring your favorite series now!</p>
    </div>
</section>
